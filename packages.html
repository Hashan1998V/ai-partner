<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Package</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:white;
    min-height:100vh;
    padding:40px 20px;
}

h2{
    text-align:center;
    margin-bottom:40px;
    font-size:36px;
}

.package-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    max-width:1200px;
    margin:auto;
}

.package-card{
    background:rgba(255,255,255,0.08);
    border-radius:22px;
    padding:30px;
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 12px 35px rgba(0,0,0,0.25);
}

.package-card h3{
    font-size:28px;
    margin-bottom:15px;
}

.package-card p{
    color:#dbe4ff;
    margin-bottom:12px;
    line-height:1.6;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.92;
}

@media(max-width:600px){

    body{
        padding:20px 14px;
    }

    h2{
        font-size:28px;
    }

    .package-card{
        padding:22px;
    }
}

</style>
</head>

<body>

<h2>Select Your Package</h2>

<div class="package-grid">

{% for key, package in packages.items() %}

<div class="package-card">

<h3>{{ package.name }}</h3>

<p>Messages: {{ package.messages }}</p>

<p>Price: ${{ package.price / 100 }}</p>

<form action="/create-checkout-session/{{ key }}" method="POST">

<button type="submit">
Buy Now
</button>

</form>

</div>

{% endfor %}

</div>

</body>
</html>
